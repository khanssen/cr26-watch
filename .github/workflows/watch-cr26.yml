name: Watch FedRAMP/rules for CR26 changes
on:
  schedule:
    - cron: "17 11 * * *"     # daily, 11:17 UTC (~07:17 ET)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - id: chk
        run: python scripts/check_upstream.py
      - name: Commit snapshot and reports
        if: steps.chk.outputs.changed == 'true'
        run: |
          git config user.name "cr26-watch"
          git config user.email "cr26-watch@users.noreply.github.com"
          git add data/cr26 reports
          git commit -m "CR26: ${{ steps.chk.outputs.note }}"
          git push
      - name: Ensure labels exist
        if: steps.chk.outputs.changed == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create cr26-change          --color 1d76db --description "Upstream CR26 dataset changed" --force
          gh label create cr26-mapping         --color b60205 --description "KSI -> 800-53 controls arrays changed" --force
          gh label create cr26-ruleset         --color d93f0b --description "Ruleset metadata changed (status, effective dates, applicability)" --force
          gh label create cr26-force           --color fbca04 --description "Normative keyword or force changed" --force
          gh label create cr26-no-version-bump --color 5319e7 --description "Content changed without a version bump" --force
      - name: Open issue with the diff
        if: steps.chk.outputs.changed == 'true' && steps.chk.outputs.report != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue create --title "CR26: ${{ steps.chk.outputs.note }}" \
            --body-file "${{ steps.chk.outputs.report }}" --label "${{ steps.chk.outputs.labels }}"
